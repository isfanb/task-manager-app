<mat-dialog-content>
  <h3 class="dialog-title" mat-dialog-title>Delete file</h3>
</mat-dialog-content>
<mat-dialog-content class="dialog-confirm">
  Would you like to delete {{ data.title }}?
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false">No</button>
  <button matButton [mat-dialog-close]="true" cdkFocusInitial>Yes</button>
</mat-dialog-actions>
